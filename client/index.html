<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Charity Pulse</title>
    <style>
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f7f7f9; -webkit-font-smoothing: antialiased; }
      * { box-sizing: border-box; }
      input:focus, button:focus, select:focus { outline: 2px solid rgba(91,91,214,.35); outline-offset: 1px; }
      input::placeholder, textarea::placeholder { color: #c2c2ca; opacity: 1; }
      button { transition: filter 120ms ease, transform 120ms ease, box-shadow 120ms ease; }
      button:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(24,24,27,.16); }
      button:active:not(:disabled) { filter: brightness(0.92); transform: translateY(0); box-shadow: none; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: #d8d8de; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
