<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#25555f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Charity Pulse" />
    <title>Charity Pulse</title>
    <style>
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #faf8f2; -webkit-font-smoothing: antialiased; }
      * { box-sizing: border-box; }
      input:focus, button:focus, select:focus { outline: 2px solid rgba(37,85,95,.35); outline-offset: 1px; }
      input::placeholder, textarea::placeholder { color: #c7c0b1; opacity: 1; }
      button { transition: filter 120ms ease, transform 120ms ease, box-shadow 120ms ease; }
      button:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(35,48,47,.16); }
      button:active:not(:disabled) { filter: brightness(0.92); transform: translateY(0); box-shadow: none; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb { background: #ded6c4; border-radius: 6px; }
      /* Bigger tap targets on phones — every input/button/select in the app
         gets this for free, no per-component edits needed. 44px matches the
         standard iOS/Android minimum comfortable touch target. */
      @media (max-width: 767px) {
        input, select, textarea, button { min-height: 44px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
